[project]
name = "p3net"
version = "0.0.1"
description = "A linkage-learning search engine (P3) paired with a relative, linkage-aware surrogate, for black-box combinatorial optimisation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # TODO: add core deps as implementation lands (see TASKS.md Phase 1+) --
    # expected to include a numeric/ML stack for the surrogates, e.g. numpy,
    # scipy, and scikit-learn or a small torch model for delta_hat_F /
    # absolute_regressor.
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3net"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
