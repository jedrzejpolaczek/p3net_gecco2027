[project]
name = "p3net-experiments"
version = "0.0.1"
description = "Reproduction of the P3Net GECCO 2027 paper experiment: joint neural architecture and hyperparameter search on JAHS-Bench-201 and NAS-HPO-Bench-II."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "p3net",
    # TODO: add benchmark deps (JAHS-Bench-201, NAS-HPO-Bench-II Python
    # packages) and baseline-wrapper deps for methods/external/* (SH-EMOA,
    # MO-BOHB, TPE implementations) as implementation lands (see TASKS.md).
    # These are deliberately kept out of ../lib/pyproject.toml -- heavy,
    # benchmark- and baseline-specific, irrelevant to anyone using p3net
    # outside this paper's reproduction.
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Local, editable dependency on the sibling p3net library -- experiments/
# must consume p3net exactly the way an external downstream user would,
# never via relative imports into ../lib/src/p3net. This is deliberate: it
# is the forcing function that keeps the library's public API honest.
[tool.uv.sources]
p3net = { path = "../lib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "search_spaces",
    "substrates",
    "search_engines",
    "methods",
    "metrics",
    "stats",
    "reporting",
]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
