[project]
name = "p3net-experiments"
version = "0.0.1"
description = "Reproduction of the P3Net GECCO 2027 paper experiment: joint neural architecture and hyperparameter search on JAHS-Bench-201 and NAS-HPO-Bench-II."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "p3net",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "optuna>=4.9.0",
    "nashpobench2api>=1.0.0",
    "pyro4>=4.82",
    "serpent>=1.43",
    "configspace>=1.2.2",
    "statsmodels>=0.14.6",
    # Declared directly (not just a transitive dep of hpbandster) so the
    # [tool.uv.sources] redirect to the local stub below actually applies
    # -- uv only honors a source override for packages in the resolvable
    # requirement set, not arbitrary transitive dependencies.
    "netifaces",
    "hpbandster>=0.7.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Local, editable dependency on the sibling p3net library -- experiments/
# must consume p3net exactly the way an external downstream user would,
# never via relative imports into ../lib/src/p3net. This is deliberate: it
# is the forcing function that keeps the library's public API honest.
[tool.uv.sources]
p3net = { path = "../lib", editable = true }
# netifaces has no prebuilt wheel for modern Python on Windows and needs
# MSVC Build Tools to build from source. It's a hard install_requires of
# hpbandster (MO-BOHB's backend) but is only ever used inside a lazy
# import in a function this project's usage never calls -- see
# vendor/netifaces-stub/netifaces/__init__.py for the verified reasoning.
netifaces = { path = "vendor/netifaces-stub", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "search_spaces",
    "substrates",
    "search_engines",
    "methods",
    "metrics",
    "stats",
    "reporting",
]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
