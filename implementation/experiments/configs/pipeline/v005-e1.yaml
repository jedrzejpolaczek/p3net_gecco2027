# Exploratory addendum E1 of the v005 pre-registration (notes/plans/v005-preregistration.md §7a, written
# 2026-11-16 before any E1 run): does the surrogate change anything when it has room to act (b = 1000)?
# Exploratory, never confirmatory; supports no claim about P3Net vs. the other methods.
#
# Same method code as v005 (commit c674c91e); own run root, Hetzner server (30 GB, 16 threads):
#
#   bash scripts/run_pipeline.sh --plan configs/pipeline/v005-e1.yaml --run-root results/runs/c674c91e-e1 \
#       --allow-dirty
#
# --allow-dirty: on the server the working tree differs from c674c91e only in this file (the
# manifest records the list and a hash of the difference); lib/src and methods/ are unchanged.

name: v005-e1

# one JAHS dataset ~12 GB (v004/v005 memory notes); 4 workers x 2 threads on 16 threads
parallel:
  workers: 4
  jahs_max_datasets: 1

stages:
  - name: checks
    kind: checks
    cards: true
    determinism:
      search_space: nas_hpo_bench_ii_v005
      budget: 20
      seed: 1

  - name: e1
    kind: grid
    methods: [v005_p3net, v005_p3net_gate, v005_p3net_nolink, v005_p3_canonical, v005_random_search]
    search_spaces:
      - nas_hpo_bench_ii_v005
      - jahs_bench_201_v005
      - jahs_bench_201_colorectal_v005
      - jahs_bench_201_fashion_v005
    budgets: [1000]
    seeds: {from: 92, to: 121}
