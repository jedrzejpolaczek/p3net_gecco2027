# v005 objectives (notes/plans/v005-sources/mf-track.md MF-1 a): copy of fcnet_slice_localization.yaml with the source set
# explicitly -- the runner's defaults stay those of v004 so the v004 plans reproduce.
# FCNet (Klein & Hutter, 2019), task slice_localization: second benchmark family
# (phase 2d). Fixed lookup table, every configuration tabulated -> exact
# oracle front (Category 1, like NAS-HPO-Bench-II).
#
# f1 = validation MSE after 100 epochs, f2 = training time (s); both are
# means over the table's 4 training seeds (substrates/fcnet.py).

search_space: fcnet_genotype
substrate: fcnet
task: slice_localization

fidelity:
  epochs: 100

# Separate benchmark family with its own pipeline stage and table: kept out of
# the legacy scripts/run_grid.py default grid (same opt-out as nas_bench_201).
default_grid: false

# v005: f2 at e < E epochs = training time observed up to epoch e (MF-1 a)
f2_at_fidelity: observed
