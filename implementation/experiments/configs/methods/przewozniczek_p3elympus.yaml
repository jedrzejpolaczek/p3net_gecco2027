# PrzewozniczekP3ELyMPuS: P3-eLyMPuS, reconstructed and generalised from
# binary to k-ary categorical domains -- notes/plans/experiments-przewozniczek-plan.md.
#
#   - search engine: canonical, single-individual-climbing P3
#     (p3net.search_engines.p3.canonical_pyramid, Goldman 2014, Algorithm
#     3/4 shape) -- the same engine methods.bartnik_p3.BartnikP3 (sibling
#     experiments-bartnik package) uses.
#   - local search step: FIHC-eLyMPuS (p3net.search_engines.p3.fihc_elympus),
#     driven by p3net.surrogates.elympus.ELyMPuS -- this project's own
#     generalisation of the source paper's binary partial-comparison
#     mechanism to k-ary domains (notes/lympus-nas-adaptation-literature.md,
#     notes/lympus-nas-adaptation-validation.md).
#   - surrogate: deterministic, per-objective Random Forest
#     (p3net.surrogates.absolute_random_forest), climbed against exclusively
#     -- both climb's GOM/promotion loop and ELyMPuS's own internal fitness
#     calls use predicted objectives, not real ones (methods/
#     przewozniczek_p3elympus.py's own module docstring explains why: this
#     harness's Method protocol gives no method direct substrate access).
#   - acceptance gate: lambda-quantile threshold on predicted f1 improvement
#     over the current best real f1 (Dushatskiy 2021, Algorithm 7/8 shape),
#     relaxed by eta each time a climb attempt has to fall back to a random
#     genotype, reset to a fresh quantile whenever the real Pareto front
#     changes.
#   - warmup: ell random real evaluations before any surrogate/pyramid
#     activity (null below defers to the search space's own dimensionality,
#     ell = 6 for architecture-only NAS-Bench-201's six edges).
#
# Explicitly NOT implemented here (plan's Faza 5): full OLyMPuS (PXrLL,
# ILS-like perturbation, circuit-based missing-linkage detection),
# directional (C4-C6) dependency discovery, probabilistic surrogate/gate.
#
# Reference: notes/plans/experiments-przewozniczek-plan.md; conclusions/main.tex
# ("Why the results are what they are").

method: przewozniczek_p3elympus
default_grid: false
params:
  warmup: null
  lambda_quantile: 0.5
  eta: 0.999
  n_estimators: 100
  objective_index: 0
  max_climb_attempts: 5
