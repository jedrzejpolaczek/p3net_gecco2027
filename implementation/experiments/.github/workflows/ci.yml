name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiments
        uses: actions/checkout@v4
        with:
          path: p3net-experiments

      - name: Checkout p3net (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: jedrzejpolaczek/p3net
          path: lib # sibling of p3net-experiments/, matching pyproject.toml's ../lib

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: p3net-experiments
        run: uv sync --extra dev

      - name: Lint
        working-directory: p3net-experiments
        run: uv run ruff check .

      - name: Format check
        working-directory: p3net-experiments
        run: uv run ruff format --check .

      - name: Test
        working-directory: p3net-experiments
        run: uv run pytest
