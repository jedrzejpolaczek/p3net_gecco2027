# JAHS-Bench-201 search-space config, Fashion-MNIST dataset variant
# (secondary robustness check, added 2026-08-16 -- see
# jahs_bench_201_colorectal.yaml's header for the full rationale, shared
# verbatim by this file).
#
# Fashion-MNIST is grayscale (1 channel vs. cifar10's 3) and a different
